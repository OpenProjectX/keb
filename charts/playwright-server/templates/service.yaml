apiVersion: v1
kind: Service
metadata:
  name: {{ include "playwright-server.fullname" . }}
  labels:
    {{- include "playwright-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "playwright-server.selectorLabels" . | nindent 4 }}
  ports:
    - name: websocket
      port: {{ .Values.service.port }}
      protocol: TCP
      targetPort: websocket

