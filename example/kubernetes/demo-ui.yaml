apiVersion: apps/v1
kind: Deployment
metadata:
  name: keb-example-ui
  labels:
    app.kubernetes.io/name: keb-example-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keb-example-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keb-example-ui
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: index
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: assets
              mountPath: /usr/share/nginx/html/assets
              readOnly: true
      volumes:
        - name: index
          configMap:
            name: keb-example-ui-index
        - name: assets
          configMap:
            name: keb-example-ui-assets
---
apiVersion: v1
kind: Service
metadata:
  name: keb-example-ui
  labels:
    app.kubernetes.io/name: keb-example-ui
spec:
  selector:
    app.kubernetes.io/name: keb-example-ui
  ports:
    - name: http
      port: 80
      targetPort: http
