services:
  playwright:
    image: ghcr.io/openprojectx/playwright-server:latest
    init: true
    stdin_open: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1},host.docker.internal"
      no_proxy: "${no_proxy:-localhost,127.0.0.1},host.docker.internal"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s=require('net').connect(3000,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"
      interval: 1s
      timeout: 2s
      retries: 60
