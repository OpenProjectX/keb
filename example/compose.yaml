services:
  playwright:
    image: ghcr.io/openprojectx/mcr/playwright:v1.62.1
    init: true
    user: pwuser
    working_dir: /home/pwuser
    command:
      - /bin/sh
      - -c
      - npx -y playwright@1.62.1 run-server --port 3000 --host 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1},host.docker.internal"
      no_proxy: "${no_proxy:-localhost,127.0.0.1},host.docker.internal"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const s=require('net').connect(3000,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"
      interval: 1s
      timeout: 2s
      retries: 60
